[project]
name = "stockchart"
version = "1.0.0"
description = "Stock Chart Analysis Tool"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "baostock>=0.8.8",
    "akshare>=1.11.0",
    "pyecharts>=2.0.4",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "certifi>=2023.7.22",
    "pywebview>=5.0",
]

[project.optional-dependencies]
chart-export = [
    "selenium>=4.0.0",
    "webdriver-manager>=4.0.0",
]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
